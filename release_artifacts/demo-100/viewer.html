function card(p){
 let r=p.research_result||{claims:[],availability:{}}, s=p.synthesis||{sentences:[]}, e=p.evidence||{};
 let synth=s.sentences.map(x=>`<li>${esc(x.text)} <span class="meta">${(x.claim_ids||[]).map(id=>`<a href="#${esc(id)}">${esc(id)}</a>`).join(' ')} ${esc((x.change_ids||[]).join(', '))}</span></li>`).join('')||'<li>No supported synthesis facts.</li>';
 let sources=Object.entries(e).map(([k,v])=>`<li><b>${esc(k)}</b> <span class="chip">${esc(v.status)}</span> ${source(v)} <span class="meta">${esc(v.completeness||'')} ${esc(v.note||'')}</span></li>`).join('');
 return `<article><h2>${esc(p.name||'Unknown legal entity')}</h2><div class="meta">Organisation number: ${esc(p.organisation_number)}</div><h3>Evidence-grounded overview</h3><ul>${synth}</ul><h3>Verified claims</h3><ul>${r.claims.map(c=>claim(c,e)).join('')||'<li>None</li>'}</ul>${history(p)}${retained(p)}<details><summary>Sources and availability</summary><ul>${sources}</ul></details></article>`
}
function visible(){let needle=q.value.toLowerCase();return data.filter(p=>`${p.organisation_number} ${p.name||''}`.toLowerCase().includes(needle))}
// Independent selectors allow arbitrary pairs even when their names differ.
const selectors=document.createElement('div');selectors.innerHTML=`<label>First company <select id="first-company" aria-label="First comparison company"></select></label> <label>Second company <select id="second-company" aria-label="Second comparison company"></select></label>`;q.after(selectors);
const first=document.getElementById('first-company'),second=document.getElementById('second-company');
for(const p of data){for(const select of [first,second]){const option=document.createElement('option');option.value=p.organisation_number;option.textContent=`${p.name} (${p.organisation_number})`;select.append(option)}}if(data.length>1)second.selectedIndex=1;
selectors.style.cssText='display:flex;flex-wrap:wrap;gap:.8rem;margin:.8rem 0';for(const select of [first,second])select.style.cssText='max-width:100%;font:inherit';
function factCell(p,field){const cs=((p.research_result||{}).claims||[]).filter(c=>c.field===field);if(!cs.length)return '<span class="unknown">No supported fact — inspect sources and availability</span>';return cs.map(c=>`${esc(val(c.value))} <span class="meta">${esc(val(c.reporting_period||''))} ${esc(c.scope||'')}</span> ${(c.evidence_fields||[]).map(k=>(p.evidence||{})[k]?source(p.evidence[k]):'Evidence unavailable').join(' ')}`).join('<br>')}
function comparePair(){const rows=[first.value,second.value].map(id=>data.find(p=>p.organisation_number===id));if(!rows[0]||!rows[1]||first.value===second.value){comparison.innerHTML='<article>Choose two different companies.</article>';return}const fields=[['financial_revenue','Operating income'],['financial_annual_result','Annual result'],['registered_role','Registered leadership'],['registered_subunit','Registered locations']];comparison.innerHTML=`<article><h2>Selected-company fact comparison</h2><table><tr><th>Fact</th>${rows.map(p=>`<th>${esc(p.name)} (${esc(p.organisation_number)})</th>`).join('')}</tr>${fields.map(([field,label])=>`<tr><th>${esc(label)}</th>${rows.map(p=>`<td>${factCell(p,field)}</td>`).join('')}</tr>`).join('')}</table></article>`;app.innerHTML=rows.map(card).join('')}
function draw(){let rows=visible();app.innerHTML=rows.map(card).join('')||'<article>No matching profile.</article>';comparison.innerHTML=''}q.oninput=draw;document.getElementById('compare').onclick=()=>{let rows=visible();if(rows.length<2){comparison.innerHTML='<article>Select at least two companies to compare.</article>';return}let cells=rows.map(p=>{let c=(p.research_result||{claims:[]}).claims||[];return `<tr><td>${esc(p.name||'Unknown')}</td><td>${esc(p.organisation_number)}</td><td>${c.filter(x=>x.field==='registered_role').length}</td><td>${c.filter(x=>String(x.field).startsWith('financial_')).length}</td><td>${c.filter(x=>x.field==='registered_subunit').length}</td></tr>`}).join('');comparison.innerHTML=`<article><h2>Visible-company comparison</h2><table><tr><th>Company</th><th>Organisation</th><th>Roles</th><th>Financial facts</th><th>Subunits</th></tr>${cells}</table></article>`};draw();
document.getElementById('compare').textContent='Compare selected companies';document.getElementById('compare').onclick=comparePair;
</script></html>
